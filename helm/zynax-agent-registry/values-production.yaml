# SPDX-License-Identifier: Apache-2.0
# Production overrides — do NOT store secret values here.
# TLS is wired from a K8s Secret (see values.yaml tlsSecretName). The service is
# stateless (ADR-039): there is no database and no DSN secret.
replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Wire the cert-manager issued certificate secret (ADR-020).
tlsSecretName: "zynax-agent-registry-tls"
