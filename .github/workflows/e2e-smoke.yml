# SPDX-License-Identifier: Apache-2.0
# e2e smoke — gated/optional live-cluster end-to-end test (EPIC G #770 step 5, #813).
#
# Runs a 2-leg engine matrix (engine ∈ {temporal, argo}, fail-fast: false —
# #1071, EPIC #771, ADR-015 pluggable engines). Each leg brings up its own
# ephemeral kind cluster on its own runner and deploys the zynax-umbrella chart
# with engine-selecting values (cluster-up.sh + values-e2e-argo.yaml overlay):
#   - temporal leg: happy-path + failure-path workflow assertions
#     (scripts/e2e/e2e-happy.sh, scripts/e2e/e2e-failure.sh), then the Helm
#     upgrade/rollback assertion (scripts/e2e/helm-upgrade.sh). This leg is the
#     protected baseline — behavior identical to the pre-matrix gate.
#   - argo leg: Argo happy-path assertion (scripts/e2e/e2e-argo.sh — Workflow
#     CR reaches phase Succeeded). cluster-up.sh additionally installs the Argo
#     Workflows control plane (pinned argo-helm chart) for this leg.
#
# These legs ARE the Zynax Engine Conformance Suite run (ZECS,
# docs/conformance/README.md). Each leg records its per-scenario step outcomes
# and the zecs-matrix job renders one machine-readable matrix over all legs
# (#1774) — a report over this matrix, never a second harness (ADR-040).
#
# GATED, NOT a required PR gate: it triggers ONLY on changes to helm/**,
# services/**, or engine-adapter/**, plus manual workflow_dispatch. It is
# deliberately excluded from the branch-protection required-check set — only
# developers landing infra/service changes need to watch it.
#
# Image lane (#1118 / ADR-027): when the PR touches docker-relevant paths, the
# pre-merge build-images job in ci.yml pushes staging/<svc>:pr-<head-sha> images;
# this workflow waits for them and deploys THOSE (the exact binaries under
# review) instead of the :main lane. PRs with no docker changes — and runs where
# the staging images never appear (build-images failed, or the staging packages
# are not public yet) — fall back to :main with a warning.
#
# All third-party Actions are pinned to a full 40-char commit SHA.

name: e2e smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "helm/**"
      - "services/**"
      - "engine-adapter/**"
      - "scripts/e2e/**"
      - ".github/workflows/e2e-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e smoke (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Engine matrix (#1071, EPIC #771): both pluggable engines (ADR-015) are
      # validated per run. fail-fast off so a red argo leg never cancels the
      # protected temporal baseline (and vice versa).
      fail-fast: false
      matrix:
        engine: [temporal, argo]
    env:
      HELM_VERSION: v3.17.3
      KIND_VERSION: v0.23.0
      # v1.30.0: the node image validated for kind v0.23.0; first with
      # ValidatingAdmissionPolicy GA (ADR-045, M8.G #1634). Keep in lockstep
      # with the cluster-up.sh default and the kubectl download below.
      KIND_NODE_IMAGE: kindest/node:v1.30.0@sha256:047357ac0cfea04663786a612ba1eaba9702bef25227a794b52890dd8bcd692e
      GRPCURL_VERSION: "1.9.3"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0   # lane resolution diffs base...head

      - name: Install kind + kubectl + Helm + grpcurl
        # The e2e scripts own cluster bootstrap (cluster-up.sh creates the kind
        # cluster idempotently), so this step only installs the binaries on PATH.
        # grpcurl is required by e2e-happy.sh for the memory-service KV
        # roundtrip assertion (#1090).
        run: |
          curl -sSLo /tmp/kind \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo install /tmp/kind /usr/local/bin/kind
          kind version

          curl -sSLo /tmp/kubectl \
            "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl"
          sudo install /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client

          curl -sSLo /tmp/helm.tar.gz \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          tar -C /tmp -xzf /tmp/helm.tar.gz linux-amd64/helm
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short

          curl -sSLo /tmp/grpcurl.tar.gz \
            "https://github.com/fullstorydev/grpcurl/releases/download/v${GRPCURL_VERSION}/grpcurl_${GRPCURL_VERSION}_linux_x86_64.tar.gz"
          tar -C /tmp -xzf /tmp/grpcurl.tar.gz grpcurl
          sudo install /tmp/grpcurl /usr/local/bin/grpcurl
          grpcurl --version

      - name: Add Helm repositories
        run: |
          helm repo add nats https://nats-io.github.io/k8s/helm/charts
          helm repo add temporalio https://temporalio.github.io/helm-charts
          helm repo add jetstack https://charts.jetstack.io
          helm repo update

      # Runs AFTER the tool installs so that setup work overlaps the wait for
      # staging images instead of preceding it (the wait dominated this job's
      # wall-clock before build-images was un-gated from lint-go in ci.yml).
      - name: Resolve service image lane (staging when this PR built images)
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          # Same docker-relevance pattern as the `changes` job in ci.yml — keep in sync.
          if ! git diff --name-only "${BASE_SHA}...${HEAD_SHA}" \
               | grep -qE '^(services/|infra/docker/Dockerfile\.|agents/adapters/[^/]+/Dockerfile$)'; then
            echo "No docker-relevant changes — deploying the :main image lane."
            exit 0
          fi
          echo "Docker-relevant changes — waiting for staging images (pr-${HEAD_SHA})…"
          DEADLINE=$(( $(date +%s) + 1200 ))   # build-images runs in parallel in ci.yml
          for svc in api-gateway workflow-compiler engine-adapter task-broker agent-registry memory-service; do
            IMG="ghcr.io/zynax-io/zynax/staging/${svc}:pr-${HEAD_SHA}"
            until docker manifest inspect "${IMG}" >/dev/null 2>&1; do
              if [ "$(date +%s)" -ge "${DEADLINE}" ]; then
                echo "::warning::staging image ${IMG} did not appear — falling back to the :main lane. Check the build-images job and that the staging packages are public."
                exit 0
              fi
              sleep 10
            done
            echo "  ✓ ${IMG}"
          done
          {
            echo "E2E_IMAGE_PREFIX=ghcr.io/zynax-io/zynax/staging"
            echo "E2E_IMAGE_TAG=pr-${HEAD_SHA}"
          } >> "$GITHUB_ENV"
          echo "All staging images present — deploying the staging lane."

      - name: Bring up cluster + deploy stack
        # E2E_ENGINE selects the umbrella values per matrix leg (ADR-015): the
        # argo leg layers values-e2e-argo.yaml and installs the Argo Workflows
        # control plane (pinned argo-helm chart) before the umbrella deploy.
        env:
          E2E_ENGINE: ${{ matrix.engine }}
          # Install the Envoy Gateway edge before the umbrella (M8.F, ADR-044):
          # bearer auth + rate-limit are delegated to the edge, not in-process.
          EDGE_ENABLED: "true"
        run: scripts/e2e/cluster-up.sh

      # The `id:` of every scenario step below is the `ci_step` key the ZECS
      # membership manifest (docs/conformance/scenarios.yaml) maps its scenarios
      # to (#1774). Rename one here and you must rename it there: actionlint
      # catches the stale `steps.<id>.outcome` reference in the recording step
      # below, and a manifest still naming the old id renders that scenario
      # `not_executed` — an INCOMPLETE leg, never a silent PASS.
      - name: Happy-path workflow assertion
        id: happy-path
        if: matrix.engine == 'temporal'
        # Submits code-review.yaml via api-gateway, asserts the workflow
        # reaches a terminal success state, the workflow.completed CloudEvent
        # lands on NATS JetStream, and the memory-service KV plane roundtrips.
        # A failed assertion exits non-zero and fails the job (readable logs).
        run: scripts/e2e/e2e-happy.sh

      - name: Workflow output read-path assertion
        id: hello-world-outputs
        if: matrix.engine == 'temporal'
        # Submits hello-world.yaml (which declares a terminal `outputs:` block),
        # asserts it reaches COMPLETED, then reads GET /api/v1/workflows/{id}/outputs
        # and confirms the declared `message` output is returned — the live
        # apply → COMPLETED → read-outputs proof that closes #1103 gap #4 (M7.U).
        run: scripts/e2e/hello-world-smoke.sh

      - name: Failure-path workflow assertion
        id: failure-path
        if: matrix.engine == 'temporal'
        # Submits a workflow whose first state invokes an unreachable
        # capability, asserts it reaches a terminal failed state and the
        # workflow.failed CloudEvent lands on NATS JetStream.
        run: scripts/e2e/e2e-failure.sh

      - name: Argo happy-path workflow assertion
        id: argo-happy-path
        if: matrix.engine == 'argo'
        # Submits code-review.yaml via api-gateway against the ArgoEngine and
        # asserts the gateway projection reaches a terminal success state AND
        # the underlying Argo `Workflow` CR reaches phase Succeeded — the
        # engine's own source of truth (#811).
        run: scripts/e2e/e2e-argo.sh

      - name: Workflow CRD reconcile assertion
        id: workflow-crd
        # Both engine legs (ADR-043, M8.E; #1620, M9.C): kubectl apply a Workflow
        # custom resource and assert the api-gateway's embedded controller
        # reconciles it through the same compile->submit path to a Dispatched run,
        # keeps a thin status (no run state in the CR), and is idempotent (a
        # reconcile of the unchanged spec starts no new run). #1619 first scoped
        # this to temporal-only because the argo leg appeared to never dispatch;
        # the CR always reconciled fine — the assertion's `kubectl get workflow`
        # short name resolved to the Argo CRD (workflows.argoproj.io, present only
        # on this leg) instead of workflows.zynax.io, so it polled the wrong kind.
        # The script now pins the fully-qualified name and runs on both legs.
        run: scripts/e2e/e2e-workflow-crd.sh

      - name: Helm upgrade/rollback smoke
        if: matrix.engine == 'temporal'
        # Temporal leg only: helm-upgrade.sh re-applies values-e2e.yaml without
        # the argo overlay, which would silently flip the release back to the
        # Temporal engine mid-leg on the argo leg.
        run: scripts/e2e/helm-upgrade.sh

      # ── ZECS matrix input (#1774, M9.C step 3) ────────────────────────────
      # Recording only: no assertion, no gate, and nothing here can change this
      # leg's conclusion. `always()` is load-bearing — a leg that failed early
      # must still report, and every step that never executed reports `skipped`,
      # which the matrix renders SKIPPED/not_executed (never PASS) and which
      # makes the leg INCOMPLETE. The matrix itself is rendered once, for all
      # legs, in the zecs-matrix job below.
      - name: Record ZECS scenario outcomes
        if: always()
        run: |
          {
            echo "leg=${{ matrix.engine }}"
            echo "happy-path=${{ steps.happy-path.outcome }}"
            echo "hello-world-outputs=${{ steps.hello-world-outputs.outcome }}"
            echo "failure-path=${{ steps.failure-path.outcome }}"
            echo "argo-happy-path=${{ steps.argo-happy-path.outcome }}"
            echo "workflow-crd=${{ steps.workflow-crd.outcome }}"
          } > "zecs-outcomes-${{ matrix.engine }}.txt"
          cat "zecs-outcomes-${{ matrix.engine }}.txt"

      - name: Upload ZECS leg outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zecs-outcomes-${{ matrix.engine }}
          path: zecs-outcomes-${{ matrix.engine }}.txt
          retention-days: 14
          if-no-files-found: error

      - name: Tear down cluster
        if: always()
        run: scripts/e2e/cluster-down.sh

# ── ZECS per-engine matrix (#1774, M9.C step 3) ───────────────────────────────
# Fan-in: renders ONE machine-readable matrix covering every engine leg the
# engine-adapter can be configured with (ADR-015) — enumerated by the tool from
# services/engine-adapter/cmd/engine-adapter/main.go, so engine N+1 appears here
# with no edit to this workflow. A leg whose outcome artifact is missing (job
# cancelled, runner lost, upload failed) renders NOT_RUN and sets
# `complete: false`; it is never omitted, so a partial run cannot be published as
# a conformance result.
#
# ADVISORY BY CONSTRUCTION: it reports, it does not gate. `always()` so it runs
# on a red leg (that is when the matrix matters most), and the emit step cannot
# turn a leg red. Per-release publication of this artifact is #1775.
  zecs-matrix:
    name: ZECS matrix
    needs: [e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download per-leg outcomes
        # Advisory: with no matching artifact (both legs died before recording)
        # download-artifact errors, and the matrix must still be emitted — every
        # leg then renders NOT_RUN with complete:false.
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: zecs-outcomes
          pattern: zecs-outcomes-*
          merge-multiple: true

      - name: Emit the ZECS per-engine matrix
        # zynax-ci-run.sh compiles from source outside the ci-runner container,
        # so this always runs the verb as it exists on this ref (no baked-binary
        # staleness window). Paths MUST be absolute: that helper cd's into
        # cmd/zynax-ci, so a relative --outcomes/--out resolves there instead.
        # mkdir -p: with no leg artifact at all the download step above fails and
        # creates nothing, and the matrix must still be emitted (all legs NOT_RUN).
        run: |
          mkdir -p "$GITHUB_WORKSPACE/zecs-outcomes"
          bash tools/ci/zynax-ci-run.sh conformance matrix \
            --root "$GITHUB_WORKSPACE" \
            --outcomes "$GITHUB_WORKSPACE/zecs-outcomes" \
            --out "$GITHUB_WORKSPACE/zecs-matrix.json" \
            --revision "${{ github.event.pull_request.head.sha || github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "### ZECS engine conformance matrix"
            echo '```json'
            cat "$GITHUB_WORKSPACE/zecs-matrix.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the ZECS matrix
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zecs-matrix
          path: zecs-matrix.json
          retention-days: 90
          if-no-files-found: error
