// SPDX-License-Identifier: Apache-2.0
//
// Agent identity messages — AgentDef and CapabilityDef.
//
// This file no longer declares a service. The push-registration RPCs
// (RegisterAgent, DeregisterAgent, GetAgent, ListAgents, FindByCapability)
// were deprecated in M8 (#1584) and hard-removed in M9 (#1598) under the
// ADR-039 removal clause: the zynax.io/v1alpha1 Agent custom resource is the
// single source of truth for agent identity, and dispatch selection lives in
// SchedulerService.SelectAgent (scheduler.proto).
//
// The messages below survive because scheduler.proto reuses them — SelectAgent
// answers with the AgentDef it picked. The file name is retained so importers
// keep resolving (renaming it would be a second, unnecessary break).
//
// Design rationale: ADR-001 (gRPC as inter-service protocol), ADR-039
// (CRD-native scheduler), ADR-048 (deprecation policy — this removal shipped a
// deprecation in v0.7.0 first, with the buf breaking exception scoped to this
// file in protos/buf.yaml).
//
// Contract invariants:
//   1. capability.name must be unique within an AgentDef.
//   2. label keys and values follow Kubernetes label syntax constraints.
//   3. input_schema and output_schema, when non-empty, MUST be valid JSON.

syntax = "proto3";

package zynax.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/zynax-io/zynax/gen/go/zynax/v1;zynaxv1";

// AgentStatus is the lifecycle state of an agent.
// Ordinal values are permanent — never reorder or reassign (ADR-001 §backward-compat).
enum AgentStatus {
  // Never set by the platform. Proto3 default sentinel; presence indicates
  // a missing or corrupt status field.
  AGENT_STATUS_UNSPECIFIED = 0;

  // The agent is active and eligible for capability routing.
  AGENT_STATUS_REGISTERED = 1;

  // The agent is no longer eligible for dispatch. Retained for audit and
  // replay purposes.
  AGENT_STATUS_DEREGISTERED = 2;
}

// CapabilityDef declares a single named capability an agent can execute.
// The scheduler matches incoming tasks to agents via capability name.
message CapabilityDef {
  // Unique capability identifier within this agent. Matches the
  // capability_name field in ExecuteCapabilityRequest (AgentService).
  // Format: lowercase letters, digits, and underscores; 1–64 characters.
  // Required: empty string is rejected with INVALID_ARGUMENT.
  string name = 1;

  // Human-readable description surfaced in operator dashboards.
  string description = 2;

  // JSON Schema (draft-07) describing the expected input_payload structure.
  // Must be valid JSON when non-empty. Agents validate incoming payloads
  // against this schema before execution begins.
  bytes input_schema = 3;

  // JSON Schema (draft-07) describing the output payload structure returned
  // in TaskEvent.payload on COMPLETED events. Must be valid JSON when non-empty.
  bytes output_schema = 4;
}

// AgentDef is the canonical record for an agent.
// It is projected from the zynax.io/v1alpha1 Agent custom resource and
// returned by SchedulerService.SelectAgent (scheduler.proto).
message AgentDef {
  // Unique identifier for this agent. Must be non-empty.
  string agent_id = 1;

  // Human-readable name for operator dashboards and logs.
  string name = 2;

  // Optional description of what this agent does.
  string description = 3;

  // gRPC address the task broker uses to call ExecuteCapability.
  // Format: host:port. Required: empty string is rejected with INVALID_ARGUMENT.
  string endpoint = 4;

  // The capabilities this agent declares. Must contain at least one entry.
  // capability.name must be unique within this list.
  repeated CapabilityDef capabilities = 5;

  // Arbitrary key-value metadata used for selector-based filtering.
  // Keys and values follow Kubernetes label syntax: alphanumeric, '-', '_', '.'.
  // Maximum 63 characters per key and value.
  map<string, string> labels = 6;

  // Current lifecycle state of this agent.
  AgentStatus status = 7;

  // Wall-clock time when the agent record was first observed.
  google.protobuf.Timestamp registered_at = 8;

  // Wall-clock time of the most recent status change.
  google.protobuf.Timestamp updated_at = 9;
}
