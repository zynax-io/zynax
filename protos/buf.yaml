# SPDX-License-Identifier: Apache-2.0
# buf workspace configuration for all Zynax proto contracts.
# Run: make lint-protos  →  buf lint
# Run: make generate-protos  →  buf generate (issue #12)
version: v2
modules:
  # Module root is protos/ so that zynax/v1/agent.proto resolves to
  # package zynax.v1 — matching PACKAGE_DIRECTORY_MATCH expectations.
  - path: .
lint:
  use:
    - STANDARD
  except:
    # Versioning is handled at the directory level (zynax/v1/).
    # buf's PACKAGE_VERSION_SUFFIX rule would require the package name to
    # end in "v1" which conflicts with our zynax.v1 package naming choice.
    - PACKAGE_VERSION_SUFFIX
    # Streaming RPCs emit typed event messages, not response wrappers.
    # TaskEvent is the correct domain name for events in the ExecuteCapability
    # stream; renaming it ExecuteCapabilityResponse would obscure its purpose.
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE  # Detect breaking changes at the file boundary between versions
  # Documented intentional-removal exception (ADR-048 §Decision 4: an intentional
  # break is mergeable only with a governing ADR removal clause plus a documented,
  # file-scoped exception in the same PR).
  #
  # zynax/v1/event_bus.proto — the EventBusService gRPC facade. Deprecated in
  # v0.7.0 (option deprecated = true, ADR-046 Decision 6), zero callers after
  # #1700/#1701, removed on the M9 milestone boundary (#1702). Replacement:
  # libs/zynaxevents over NATS JetStream, contract of record
  # spec/asyncapi/zynax-events.yaml. The entry is scoped to this one file: every
  # other proto stays under the full FILE ruleset. Delete this block once the
  # against-branch no longer carries event_bus.proto (i.e. after the v0.8.0 tag).
  ignore:
    - zynax/v1/event_bus.proto
  # Same mechanism, narrower scope — zynax/v1/agent_registry.proto keeps its
  # AgentDef/CapabilityDef messages, so only the two rules the removal actually
  # trips are waived rather than the whole file.
  #   (a) ADR-039 §Consequences — push registration deprecated in M8, removed in
  #       M9; the ADR-048 §Decision 3 notice window is satisfied (the deprecation
  #       shipped in v0.7.0 and every RPC answered UNIMPLEMENTED from #1584).
  #   (b) this stanza: agent_registry.proto lost its AgentRegistryService
  #       (SERVICE_NO_DELETE) and the five RPCs' nine request/response messages
  #       (MESSAGE_NO_DELETE) in #1598. The surviving messages are untouched and
  #       stay guarded by every other FILE rule.
  # Delete this block once the against-branch no longer carries the removed
  # surface (i.e. after the v0.8.0 tag).
  ignore_only:
    MESSAGE_NO_DELETE:
      - zynax/v1/agent_registry.proto
    SERVICE_NO_DELETE:
      - zynax/v1/agent_registry.proto
